# Configuration for Pages CMS (https://pagescms.org) — the visual editor at
# https://app.pagescms.org. Editing this file changes the admin forms; the
# website itself reads src/data/products.json, src/data/resources.json and the
# theme files in src/data/themes/.

media:
  - name: images
    label: Product photos
    input: src/assets/products
    output: /products
    categories: [image]
    rename: safe
  - name: files
    label: Downloads
    input: public/resources
    output: /resources
    extensions: [pdf]
    rename: safe

content:
  - name: products
    label: Products
    type: file
    path: src/data/products.json
    format: json
    list: true
    fields:
      - name: title
        label: Product name
        type: string
        required: true
        description: Shown when someone taps the piece, e.g. "Laser-Engraved Bookmark". Keep it short.

      - name: kind
        label: Kind
        type: string
        description: A short label shown above the name, e.g. "Ornament", "Scripture" or "Wall hanging".

      - name: description
        label: Description
        type: text
        required: true
        description: Two or three sentences, shown when someone taps the product.

      - name: price
        label: Price (Rs.)
        type: string
        description: 'Just the number, without "Rs.", e.g. 1200. For a range use 750-1500. Leave empty to show "Price on request".'

      - name: images
        label: Photos
        type: image
        options:
          media: images
        list:
          min: 1
        required: true
        description: Photos of the piece. If there is no cut-out photo below, the first one is shown in the collection instead. Drag to reorder.

      - name: cutout
        label: Cut-out photo
        type: image
        options:
          media: images
        description: The piece on its own with the background removed (a .png or .webp with a see-through background). This is what floats in the collection. If empty, the first photo is used.

      - name: cord
        label: Cord colour
        type: select
        description: The colour of the macramé cord. Shown in the details as "Pink cord". Pick "Wood" for pieces with no cord.
        options:
          values:
            - name: pink
              label: Pink
            - name: teal
              label: Teal
            - name: gold
              label: Gold
            - name: lavender
              label: Lavender
            - name: sage
              label: Sage
            - name: cream
              label: Cream
            - name: wood
              label: Wood (no cord)

      - name: themes
        label: Themes
        type: reference
        description: Which filters in the collection show this piece. Pick one or more. To add a new theme, use "Themes" in the menu first.
        options:
          collection: themes
          multiple: true
          search: nav
          label: "{nav}"
          value: "{path}"

      - name: variants
        label: Choices
        type: object
        list: true
        description: Optional. Versions of the piece a customer picks between, such as hanging ribbon or cord. Each needs its own photo; tapping a choice shows it, and the WhatsApp order names it. Leave empty if there is only one version.
        fields:
          - name: name
            label: Name
            type: string
            required: true
            description: 'What this version is, e.g. "Red satin ribbon". Shown on its button and in the WhatsApp order.'
          - name: material
            label: Material close-up
            type: image
            options:
              media: images
            description: Optional. A small, close photo of just the material (the ribbon, the cord), shown in this choice's square button. Square photos fit best.
          - name: colour
            label: Colour code
            type: string
            description: 'Optional. Used for the square button when there is no material close-up: a colour code like #b3263a. Leave both empty to show the name instead.'
          - name: photo
            label: Photo
            type: image
            required: true
            options:
              media: images
            description: The piece in this version, with the background removed like the cut-out photo. Take every choice's photo the same way so switching looks smooth.

      - name: swatches
        label: Show color swatches
        type: boolean
        description: Lets visitors try other macramé colours on the piece. Used for the macramé ornaments. Has no effect on a piece with Choices.

      - name: swatchColors
        label: Swatch colours
        type: string
        list: true
        description: 'Optional. The cord''s own colours as codes like #d71369, the first being the main one. Leave empty and they are picked from the first photo.'

  - name: resources
    label: Resources
    type: file
    path: src/data/resources.json
    format: json
    list: true
    fields:
      - name: title
        label: Name
        type: string
        required: true
        description: What people will download, e.g. "Christmas gift catalogue 2026".

      - name: description
        label: Description
        type: text
        description: Optional. One or two sentences about what is inside.

      - name: file
        label: PDF file
        type: file
        options:
          media: files
          extensions: [pdf]
        description: 'Upload the PDF and it gets a download button. Leave it empty and the page shows "Coming soon" until you add it.'

  - name: themes
    label: Themes
    type: collection
    path: src/data/themes
    format: json
    filename: "{fields.nav}.json"
    view:
      primary: nav
      fields: [nav, order]
      sort: [order, nav]
      default:
        sort: order
        order: asc
    fields:
      - name: nav
        label: Name
        type: string
        required: true
        description: The name on the theme's tag at the top of the page and on the shop filter, e.g. "New home". Keep it short.

      - name: order
        label: Position
        type: number
        description: Where it comes in the slideshow and the filters. 1 is first. The first theme is also the colour the page opens with.

      - name: word
        label: Big word
        type: string
        required: true
        description: The large word behind the photo, e.g. "Haven". One short word fits best.

      - name: kicker
        label: Small heading
        type: string
        required: true
        description: The small line in capitals above the sentence, e.g. "A blessing for a new home".

      - name: line
        label: Sentence
        type: text
        required: true
        description: One sentence about this kind of gift. Shown beside the photo.

      - name: cta
        label: Button text
        type: string
        required: true
        description: The button that jumps to this theme's pieces in the shop, e.g. "See pieces for the home".

      - name: background
        label: Background colour
        type: string
        required: true
        description: 'The page colour for this theme, as a colour code like #BED3AB. Pick a soft, light colour so the dark text stays easy to read.'

      - name: cord
        label: Tassel colour
        type: select
        required: true
        description: The colour of the tassels on the buttons and floating pieces while this theme shows.
        options:
          values:
            - name: pink
              label: Pink
            - name: teal
              label: Teal
            - name: gold
              label: Gold
            - name: lavender
              label: Lavender
            - name: sage
              label: Sage
            - name: cream
              label: Cream
            - name: wood
              label: Wood (no cord)

      - name: wood
        label: Floating wood pieces
        type: select
        description: Pick up to three wood shapes that float around the photo. Leave empty for a disc, a heart and क.
        options:
          multiple: true
          values:
            - name: cross
              label: Cross
            - name: disc
              label: Round disc
            - name: heart
              label: Heart
            - name: ka
              label: क (ka)
            - name: ma
              label: म (ma)
            - name: ya
              label: य (ya)
            - name: snow
              label: Snowflake

      - name: image
        label: Photo
        type: image
        required: true
        options:
          media: images
        description: The piece that hangs in the middle of the page. It must have the background removed (a .png or .webp with a see-through background), or it will show as a rectangle.

      - name: imageAlt
        label: Photo description
        type: string
        description: What the photo shows, for people who can't see it, e.g. "Haven macramé cross hanging".

      - name: imageHeight
        label: Photo height (advanced)
        type: number
        description: How tall the photo is, in pixels. Usually 620. Make it smaller for wide pieces. Phones size it on their own.

      - name: cordLength
        label: Cord length (advanced)
        type: number
        description: How long the string above the photo is, in pixels, measured from the top of the page. Usually 120, so the photo hangs below the wood shapes at the top. Use 0 for no string.

      - name: top
        label: Space above (advanced)
        type: number
        description: Pushes the photo down from the top, in pixels. Usually 0.
