# Configuration for Pages CMS (https://pagescms.org) — the visual editor for
# products at https://app.pagescms.org. Editing this file changes the admin
# form; the website itself reads src/data/products.json and src/data/resources.json.

media:
  - name: images
    label: Product photos
    input: src/assets/products
    output: /products
    categories: [image]
    rename: safe
  - name: files
    label: Downloads
    input: public/resources
    output: /resources
    extensions: [pdf]
    rename: safe

content:
  - name: products
    label: Products
    type: file
    path: src/data/products.json
    format: json
    list: true
    fields:
      - name: title
        label: Product name
        type: string
        required: true
        description: Shown when someone taps the piece, e.g. "Laser-Engraved Bookmark". Keep it short.

      - name: kind
        label: Kind
        type: string
        description: A short label shown above the name, e.g. "Ornament", "Scripture" or "Wall hanging".

      - name: description
        label: Description
        type: text
        required: true
        description: Two or three sentences, shown when someone taps the product.

      - name: price
        label: Price (Rs.)
        type: string
        description: 'Just the number, e.g. 1200. For a range use 750-1500. Leave empty to show "TBD".'

      - name: images
        label: Photos
        type: image
        options:
          media: images
        list:
          min: 1
        required: true
        description: Photos of the piece. If there is no cut-out photo below, the first one is shown in the collection instead. Drag to reorder.

      - name: cutout
        label: Cut-out photo
        type: image
        options:
          media: images
        description: The piece on its own with the background removed (a .png or .webp with a see-through background). This is what floats in the collection. If empty, the first photo is used.

      - name: cord
        label: Cord colour
        type: select
        description: The colour of the macramé cord. Shown in the details as "Pink cord". Pick "Wood" for pieces with no cord.
        options:
          values:
            - name: pink
              label: Pink
            - name: teal
              label: Teal
            - name: gold
              label: Gold
            - name: lavender
              label: Lavender
            - name: sage
              label: Sage
            - name: cream
              label: Cream
            - name: wood
              label: Wood (no cord)

      - name: themes
        label: Themes
        type: select
        description: Which filters in the collection show this piece. Pick one or more.
        options:
          multiple: true
          values:
            - name: christmas
              label: Christmas
            - name: scripture
              label: Scripture
            - name: love
              label: Someone you love
            - name: home
              label: New home
            - name: custom
              label: Custom

      - name: swatches
        label: Show color swatches
        type: boolean
        description: Lets visitors try other macramé colours on the piece. Used for the macramé ornaments.

      - name: swatchColors
        label: Swatch colours
        type: string
        list: true
        description: 'Optional. The cord''s own colours as codes like #d71369, the first being the main one. Leave empty and they are picked from the first photo.'

  - name: resources
    label: Resources
    type: file
    path: src/data/resources.json
    format: json
    list: true
    fields:
      - name: title
        label: Name
        type: string
        required: true
        description: What people will download, e.g. "Christmas gift catalogue 2026".

      - name: description
        label: Description
        type: text
        description: Optional. One or two sentences about what is inside.

      - name: file
        label: PDF file
        type: file
        options:
          media: files
          extensions: [pdf]
        description: 'Upload the PDF and it gets a download button. Leave it empty and the page shows "Coming soon" until you add it.'
